<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engineering Pocket Tools</title>
<meta name="description" content="Free engineering calculators for 4–20 mA, 0–10 V, unit conversion, roll surface speed, and signed integers. Available in English, Japanese, Simplified Chinese, and Korean.">

<style>
:root{--bg:#f5f7f8;--card:#fff;--ink:#132536;--muted:#61707c;--line:#dfe6ea;--accent:#0c6b61;--nav:#122b3c;--soft:#edf7f4;--warn:#fff3dc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:0 20px}
header{background:var(--nav);color:#fff}.head{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px}
.brand b{font-size:20px}.brand small{display:block;color:#b9cad4;letter-spacing:.08em;margin-top:2px}.lang{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px}
.lang button{border:1px solid #587080;background:transparent;color:#fff;border-radius:999px;padding:8px 11px;white-space:nowrap}.lang button.on{background:#fff;color:var(--nav)}
.hero{padding:42px 20px 26px}.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.08;margin:.2em 0}.hero p{max-width:720px;color:var(--muted);margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.tab{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px}.tab.on{background:var(--nav);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}.card h2,.card h3{margin-top:0}
.field{display:block;margin:0 0 14px}.field span{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:11px 12px;border:1px solid #cbd7dd;border-radius:9px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;margin-top:8px}.primary,.secondary{border-radius:9px;padding:11px 15px;font-weight:700}.primary{border:0;background:var(--accent);color:white;flex:1}.secondary{border:1px solid var(--line);background:#fff}
.result{font-size:clamp(30px,4vw,46px);font-weight:800;letter-spacing:-.03em;margin:8px 0 14px;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:13px}
.formula{background:#f8fafb;border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.eq{display:flex;flex-wrap:wrap;align-items:center;gap:.42em;font-family:"Times New Roman",serif;font-size:clamp(22px,3vw,34px);line-height:1.15}.frac{display:inline-grid;grid-template-rows:auto auto;text-align:center;vertical-align:middle}.frac .top{border-bottom:1.5px solid currentColor;padding:0 .2em .1em}.frac .bot{padding:.1em .2em 0}.steps{margin-top:12px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px;white-space:pre-wrap}
.status{padding:11px 12px;border-radius:9px;background:var(--soft);font-size:13px;margin-top:12px}.status.warn{background:var(--warn)}
footer{padding:34px 20px 50px;color:var(--muted);font-size:12px}.note{border-top:1px solid var(--line);padding-top:18px}
[hidden]{display:none!important}
@media(max-width:760px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.hero{padding-top:28px}.tabs{display:grid;grid-template-columns:1fr 1fr}.tab{font-size:13px}.head{align-items:flex-start;gap:12px}.lang{max-width:190px}.lang button{font-size:12px;padding:7px 9px}}
@media(max-width:440px){.head{display:block}.lang{justify-content:flex-start;max-width:none;margin-top:14px}.tabs{grid-template-columns:1fr}}
</style>
</head>

function tr(){return T[lang]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function f(n){if(!Number.isFinite(n))throw Error(tr().resultRange);if(Math.abs(n)>=1e10||(Math.abs(n)>0&&Math.abs(n)<1e-6))return n.toExponential(8);return String(Number(n.toPrecision(10)))}
function num(id,label){var s=document.getElementById(id).value.trim();if(!s||!isFinite(Number(s)))throw Error(tr().invalidNumber+label);return Number(s)}
function frac(top,bot){return '<span class="frac"><span class="top">'+top+'</span><span class="bot">'+bot+'</span></span>'}
function setFormula(html,steps){document.getElementById('formula').innerHTML='<div class="eq">'+html+'</div><div class="steps">'+esc(steps||'')+'</div>'}
function field(id,label,val,mode){return '<label class="field"><span>'+label+'</span><input id="'+id+'" value="'+val+'" inputmode="'+(mode||'decimal')+'"></label>'}
function select(id,label,opts,selected){return '<label class="field"><span>'+label+'</span><select id="'+id+'">'+opts.map(function(x){return '<option value="'+x[0]+'"'+(String(x[0])===String(selected)?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></label>'}
function renderTabs(){var order=['ma','v','units','roll','int'];document.getElementById('tabs').innerHTML=order.map(function(k,i){return '<button type="button" class="tab '+(k===active?'on':'')+'" data-k="'+k+'">'+('0'+(i+1)).slice(-2)+' · '+tr().tools[k][0]+'</button>'}).join('');Array.from(document.querySelectorAll('.tab')).forEach(function(b){b.onclick=function(){active=b.dataset.k;render()}})}
function renderFields(){
var h='',t=tr();

  h+='<div class="row">'+field('emin',t.engineeringMin,'0')+field('emax',t.engineeringMax,c?'10':'1500')+'</div>';

  h+=field('x',t.inputValue,'25.4');
}else if(active==='roll'){
  h+=select('dir',t.direction,[['f',t.rpmTo],['r',t.toRpm]]);

  h+=select('su',t.speedUnit,[['m/min','m/min'],['m/s','m/s'],['ft/min','ft/min']]);
  h+=field('x',t.inputValue,'100');
}else{
  h+='<div class="row">'+select('bits',t.wordWidth,[['8','8 bit'],['16','16 bit'],['32','32 bit'],['64','64 bit']])+select('base',t.inputFormat,[['hex',lang==='ja'?'16進数':lang==='zh'?'十六进制':lang==='ko'?'16진수':'Hex'],['bin',lang==='ja'?'2進数':lang==='zh'?'二进制':lang==='ko'?'2진수':'Binary'],['u',lang==='ja'?'符号なし10進数':lang==='zh'?'无符号十进制':lang==='ko'?'부호 없는 10진수':'Unsigned decimal'],['s',lang==='ja'?'符号付き10進数':lang==='zh'?'有符号十进制':lang==='ko'?'부호 있는 10진수':'Signed decimal']])+'</div>';
  h+=field('x',t.integer,'FFFF','text');
}
document.getElementById('fields').innerHTML=h
}
function convertUnit(q,from,to,x){
var g={length:{mm:.001,m:1,in:.0254,ft:.3048},pressure:{Pa:1,kPa:1000,MPa:1000000,bar:100000},speed:{'m/s':1,'m/min':1/60,'ft/min':.3048/60,'km/h':1/3.6}};
if(q==='temp'){function K(v,u){if(u==='K')return v;if(u==='C')return v+273.15;return (v+459.67)*5/9}function fromK(v,u){if(u==='K')return v;if(u==='C')return v-273.15;return v*9/5-459.67}return fromK(K(x,from),to)}
return x*g[q][from]/g[q][to]
}
function unitLabel(q,u){return q==='temp'?(u==='K'?'K':'°'+u):u}
function updateUnitOptions(){
if(active!=='units')return;
var q=document.getElementById('q').value,opts={length:['mm','m','in','ft'],pressure:['Pa','kPa','MPa','bar'],speed:['m/s','m/min','ft/min','km/h'],temp:['C','F','K']}[q];
['from','to'].forEach(function(id,idx){var s=document.getElementById(id),old=s.value;s.innerHTML=opts.map(function(u){return '<option value="'+u+'">'+unitLabel(q,u)+'</option>'}).join('');s.value=opts.includes(old)?old:opts[idx?1:0]})
}
function calc(ev){
if(ev)ev.preventDefault();var err=document.getElementById('err');err.hidden=true;
try{
var main='',rows='',st='',formula='',steps='',t=tr();
if(active==='ma'||active==='v'){
  var c=active==='ma',su=c?'mA':'V';
  var s0=num('smin',t.signalMin),s1=num('smax',t.signalMax),a=num('emin',t.engineeringMin),b=num('emax',t.engineeringMax),x=num('x',t.input);
  var rev=document.getElementById('dir').value==='r',u=document.getElementById('u').value.trim()||'units',bits=Number(document.getElementById('resbits').value);
  if(s0===s1||a===b)throw Error(t.rangeError);
  var sigSpan=s1-s0,engSpan=b-a,levels=Math.pow(2,bits),maxCount=levels-1;
  var p=rev?(x-a)/engSpan:(x-s0)/sigSpan;
  var r=rev?s0+p*sigSpan:a+p*engSpan;
  var slope=engSpan/sigSpan,offset=a-slope*s0;
  var sigLsb=Math.abs(sigSpan)/maxCount,engLsb=Math.abs(engSpan)/maxCount;
  var signal=rev?r:x;
  var rawFloat=(signal-s0)/sigSpan*maxCount;
  var raw=Math.round(rawFloat);
  var rawClamped=Math.max(0,Math.min(maxCount,raw));
  var quantSignal=s0+(rawClamped/maxCount)*sigSpan;
  var quantEng=a+(rawClamped/maxCount)*engSpan;
  var qErr=quantEng-(rev?x:r);
  main=f(r)+' '+(rev?su:u);
  rows=t.span+': '+f(p*100)+'%'+
    '<br>'+t.scaleFactor+': '+f(slope)+' '+u+'/'+su+
    '<br>'+t.offset+': '+f(offset)+' '+u+
    '<br>'+t.digitalLevels+': '+levels+' (0–'+maxCount+')'+
    '<br>'+t.signalResolution+': '+f(sigLsb)+' '+su+
    '<br>'+t.engineeringResolution+': '+f(engLsb)+' '+u+
    '<br>'+t.rawCount+': '+raw+' / '+maxCount+
    '<br>'+t.quantizedValue+': '+f(quantEng)+' '+u+
    '<br>'+t.quantizationError+': '+f(qErr)+' '+u;
  st=(p<0||p>1)?t.outRange:t.inRange;
  if(rev){
    formula='S = S<sub>MIN</sub> + '+frac('(X − X<sub>MIN</sub>) × (S<sub>MAX</sub> − S<sub>MIN</sub>)','X<sub>MAX</sub> − X<sub>MIN</sub>');
    steps='S = '+s0+' + ('+x+' − '+a+') × ('+s1+' − '+s0+') / ('+b+' − '+a+') = '+f(r)+' '+su;
  }else{
    formula='X = X<sub>MIN</sub> + '+frac('(S − S<sub>MIN</sub>) × (X<sub>MAX</sub> − X<sub>MIN</sub>)','S<sub>MAX</sub> − S<sub>MIN</sub>');
    steps='X = '+a+' + ('+x+' − '+s0+') × ('+b+' − '+a+') / ('+s1+' − '+s0+') = '+f(r)+' '+u;
  }
  setFormula(formula,steps);
}else if(active==='units'){
  var q=document.getElementById('q').value,from=document.getElementById('from').value,to=document.getElementById('to').value,x=num('x',t.inputValue),r=convertUnit(q,from,to,x);
  main=f(r)+' '+unitLabel(q,to);rows=t.source+': '+x+' '+unitLabel(q,from);st=q==='pressure'?t.pressureNote:'';
  setFormula('y = x × '+frac('source factor','target factor'),x+' '+unitLabel(q,from)+' = '+f(r)+' '+unitLabel(q,to));
}else if(active==='roll'){
  var d=num('d',t.diameter),du=document.getElementById('du').value,su=document.getElementById('su').value,x=num('x',t.inputValue),rev=document.getElementById('dir').value==='r';
  if(d<=0||x<0)throw Error(t.diameterError);
  var dm=convertUnit('length',du,'m',d),circ=Math.PI*dm,r;
  if(rev){var mmin=convertUnit('speed',su,'m/min',x);r=mmin/circ;main=f(r)+' rpm';setFormula('n = '+frac('v','πD'),'n = '+f(mmin)+' / (π × '+f(dm)+') = '+f(r)+' rpm')}
  else{var mmin=circ*x;r=convertUnit('speed','m/min',su,mmin);main=f(r)+' '+su;setFormula('v = πDn','v = π × '+f(dm)+' × '+x+' = '+f(mmin)+' m/min = '+f(r)+' '+su)}
  rows=t.circumference+': '+f(circ)+' m';st=t.geometry;
}else{
  var bits=Number(document.getElementById('bits').value),base=document.getElementById('base').value,raw=document.getElementById('x').value.trim(),mod=1n<<BigInt(bits),sign=mod>>1n,max=mod-1n,u;
  if(base==='hex'){raw=raw.replace(/^0x/i,'');if(!/^[0-9a-f]+$/i.test(raw))throw Error(t.invalidHex);u=BigInt('0x'+raw)}
  else if(base==='bin'){raw=raw.replace(/^0b/i,'');if(!/^[01]+$/.test(raw))throw Error(t.invalidBin);u=BigInt('0b'+raw)}
  else{if(!/^[+-]?\d+$/.test(raw))throw Error(t.invalidInteger);u=BigInt(raw);if(base==='s'){if(u< -sign||u>=sign)throw Error(t.signedRange);if(u<0)u+=mod}}
  if(u<0||u>max)throw Error(t.widthRange);
  var sv=u>=sign?u-mod:u,h=u.toString(16).toUpperCase().padStart(bits/4,'0'),bin=u.toString(2).padStart(bits,'0');
  main=sv.toString();rows=t.intLabels.unsigned+': '+u+'<br>'+t.intLabels.hex+': 0x'+h+'<br>'+t.intLabels.binary+': '+bin.replace(/(.{4})/g,'$1 ').trim();st=t.exactInteger;
  setFormula('signed = U ≥ 2<sup>N−1</sup> ? U − 2<sup>N</sup> : U','U = '+u+', N = '+bits+', signed = '+sv);
}
document.getElementById('result').textContent=main;
document.getElementById('details').innerHTML='<div class="muted">'+rows+'</div>';
document.getElementById('status').textContent=st||t.enter;
document.getElementById('status').className='status';
copyText=t.tools[active][0]+'\n'+main+'\n'+rows.replace(/<br>/g,'\n')+'\n'+st;
}catch(e){
err.textContent=e.message;err.hidden=false;document.getElementById('result').textContent='—';document.getElementById('details').innerHTML='';document.getElementById('status').textContent=tr().enter;document.getElementById('formula').innerHTML=''
}}
function render(){
var t=tr();document.documentElement.lang=t.html;
document.getElementById('heroTitle').innerHTML=t.heroTitle;document.getElementById('heroText').textContent=t.heroText;
document.getElementById('toolTitle').textContent=t.tools[active][0];document.getElementById('toolDesc').textContent=t.tools[active][1];
document.getElementById('resultHeading').textContent=t.result;document.getElementById('formulaHeading').textContent=t.formula;
document.getElementById('calcBtn').textContent=t.calc;document.getElementById('resetBtn').textContent=t.reset;document.getElementById('copyBtn').textContent=t.copy;document.getElementById('footerText').textContent=t.footer;
['en','ja','zh','ko'].forEach(function(k){document.getElementById(k+'Btn').className=lang===k?'on':''});
renderTabs();renderFields();
if(active==='units'){document.getElementById('q').onchange=function(){updateUnitOptions();calc()};updateUnitOptions()}
Array.from(document.querySelectorAll('#fields input,#fields select')).forEach(function(el){el.addEventListener('change',calc)});
calc()
}
document.getElementById('form').onsubmit=calc;
document.getElementById('resetBtn').onclick=render;
document.getElementById('copyBtn').onclick=function(){if(copyText&&navigator.clipboard)navigator.clipboard.writeText(copyText)};
document.getElementById('enBtn').onclick=function(){lang='en';render()};
document.getElementById('jaBtn').onclick=function(){lang='ja';render()};
document.getElementById('zhBtn').onclick=function(){lang='zh';render()};
document.getElementById('koBtn').onclick=function(){lang='ko';render()};
render()
})();
</script>
