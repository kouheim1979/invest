<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7">
<title>Apple株価 ウォッチリスト登録</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--blue:#007aff;--green:#34c759;--red:#ff3b30}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Yu Gothic UI",sans-serif}body{padding-bottom:calc(110px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:rgba(245,245,247,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topin{max-width:720px;margin:auto}.title{font-size:24px;font-weight:850;letter-spacing:-.02em}.sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}.wrap{max-width:720px;margin:auto;padding:12px}.hero{background:linear-gradient(145deg,#ffffff,#f8fbff);border:1px solid #dce8ff;border-radius:18px;padding:16px;margin-bottom:12px}.progress{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}.count{font-size:30px;font-weight:900}.pct{font-size:14px;color:var(--muted);font-weight:750}.totals{font-size:13px;color:#4f5965;font-weight:750;margin-top:4px}.bar{height:9px;background:#e9edf2;border-radius:99px;overflow:hidden;margin-top:10px}.bar>i{display:block;height:100%;background:var(--green);width:0;transition:.25s}.guide{font-size:13px;color:#4f5965;line-height:1.55;margin-top:12px}.guide b{color:#222}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-size:14px;font-weight:800;color:#2c2c2e}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--red)}.current{background:var(--card);border:2px solid #cfe1ff;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 6px 22px #0000000a}.eyebrow{font-size:11px;color:var(--blue);font-weight:900;letter-spacing:.08em}.cname{font-size:23px;font-weight:900;margin-top:4px}.csymbol{font-size:15px;color:var(--muted);margin-top:3px}.holdgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.holdbox{background:#f5f5f7;border-radius:12px;padding:10px 8px}.holdlabel{font-size:10px;color:var(--muted);font-weight:750}.holdval{font-size:15px;font-weight:900;margin-top:3px;font-variant-numeric:tabular-nums}.copyrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.copytext{background:#f2f2f7;border-radius:12px;padding:12px;font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.list{display:grid;gap:8px}.item{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px}.item.done{opacity:.55}.check{width:28px;height:28px;border:2px solid #c7c7cc;border-radius:50%;display:grid;place-items:center;font-size:16px;background:#fff}.item.done .check{background:var(--green);border-color:var(--green);color:#fff}.nm{font-weight:850;font-size:16px}.sm{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}.holdline{font-size:13px;color:#2c2c2e;font-weight:750;margin-top:3px}.copymini{border:0;background:#edf4ff;color:#0059c7;border-radius:10px;padding:8px 10px;font-weight:850}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}.bottomin{max-width:720px;margin:auto;display:grid;grid-template-columns:1fr 1.35fr;gap:8px}.bigbtn{border:0;border-radius:14px;padding:14px 10px;font-size:16px;font-weight:900}.bigbtn.copy{background:#eaf2ff;color:#0059c7}.bigbtn.next{background:var(--blue);color:#fff}.toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,16px);background:#1c1c1e;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;z-index:50;pointer-events:none;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,0)}.note{font-size:12px;color:var(--muted);line-height:1.55;margin:14px 3px 4px}@media(max-width:420px){.title{font-size:22px}.count{font-size:27px}.cname{font-size:21px}.holdval{font-size:14px}.bottomin{grid-template-columns:1fr 1.2fr}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="title">Apple株価 ウォッチリスト登録</div><div class="sub">今の持ち株を、Apple純正「株価」へ最短操作で登録する補助アプリ</div></div></header>
<main class="wrap">
<section class="hero"><div class="progress"><div><div class="count" id="count">0 / 0</div><div class="pct" id="pct">0% 完了</div><div class="totals" id="totals">—</div></div><button class="btn danger" id="reset">進捗をリセット</button></div><div class="bar"><i id="bar"></i></div><div class="guide"><b>使い方：</b> 下の「コピーして次へ」→ iPhoneの「株価」アプリへ切替 → 検索欄に貼付 → ＋をタップ → この画面へ戻る、を繰り返します。</div></section>
<div class="tools"><button class="btn" id="reload">持ち株を再読込</button><button class="btn" id="allDone">全部追加済みにする</button><a class="btn" href="./app-v3.html" style="text-decoration:none">ポートフォリオへ戻る</a></div>
<section class="current" id="current"><div class="eyebrow">NEXT</div><div class="cname" id="cname">—</div><div class="csymbol" id="csymbol">—</div><div class="holdgrid"><div class="holdbox"><div class="holdlabel">保有株数</div><div class="holdval" id="cshares">—</div></div><div class="holdbox"><div class="holdlabel">取得単価</div><div class="holdval" id="ccost">—</div></div><div class="holdbox"><div class="holdlabel">取得額</div><div class="holdval" id="camount">—</div></div></div><div class="copyrow"><div class="copytext" id="copytext">—</div><button class="btn primary" id="copyOne">コピー</button></div></section>
<section class="list" id="list"></section>
<div class="note">※ Apple純正「株価」のウォッチリストには保有株数や取得単価を登録する項目がないため、それらはこの補助アプリ側で表示します。最後の「＋」だけは株価アプリ側でタップが必要です。追加済み進捗はこのiPhone内に保存されます。</div>
</main>
<div class="bottom"><div class="bottomin"><button class="bigbtn copy" id="mark">追加済みにする</button><button class="bigbtn next" id="next">コピーして次へ</button></div></div>
<div class="toast" id="toast"></div>
<script>
const PORT_KEY='kouheim_portfolio_v2', PROG_KEY='kouheim_apple_stocks_progress_v1';
const FALLBACK=[
['1820.T','西松建設',100,5610],['2193.T','クックパッド',100,1535],['2685.T','アンドエスティHD',400,1922.5],['2811.T','カゴメ',400,2188.5],['2928.S','RIZAP G',400,235],['3289.T','東急不動産HD',200,643],['3395.T','サンマルクHD',200,1565],['4755.T','楽天グループ',200,745],['4801.T','セントラルスポーツ',100,1570],['5726.T','大阪チタニウム',400,2225],['6594.T','ニデック',400,3640],['6723.T','ルネサス',200,2559],['6819.T','伊豆シャボテンR',1000,236],['6841.T','横河電機',100,5338],['6902.T','デンソー',400,1872],['7545.T','西松屋',500,935.8],['7590.T','タカショー',200,748],['7606.T','ユナイテッドアローズ',800,3679.75],['7974.T','任天堂',50,9215],['8173.T','Joshin',4,1941],['8267.T','イオン',1680,771.8196428571429],['8306.T','三菱UFJ FG',4100,465.9024390243902],['8316.T','三井住友FG',100,6660],['8604.T','野村HD',6000,1098.6666666666667],['9434.T','ソフトバンク',400,241.5]
].map(([symbol,name,shares,cost])=>({symbol,name,shares,cost}));
let stocks=[],done={};
const $=s=>document.querySelector(s);
const nf=(n,d=0)=>Number.isFinite(n)?new Intl.NumberFormat('ja-JP',{maximumFractionDigits:d}).format(n):'—';
const yen=(n,d=0)=>Number.isFinite(n)?new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:d,minimumFractionDigits:d}).format(n):'—';
function baseCode(s){return String(s||'').replace(/\.(T|S)$/i,'')}
function searchText(x){return `${baseCode(x.symbol)} ${x.name}`.trim()}
function loadProgress(){try{done=JSON.parse(localStorage.getItem(PROG_KEY)||'{}')||{}}catch{done={}}}
function saveProgress(){localStorage.setItem(PROG_KEY,JSON.stringify(done))}
function normalize(x){return{symbol:String(x.symbol||x.code||'').toUpperCase(),name:String(x.name||''),shares:Number(x.shares??0),cost:Number(x.cost??0)}}
function loadStocks(){try{const raw=JSON.parse(localStorage.getItem(PORT_KEY)||'[]');stocks=Array.isArray(raw)&&raw.length?raw.map(normalize).filter(x=>x.symbol):FALLBACK}catch{stocks=FALLBACK}render()}
function nextIndex(){const i=stocks.findIndex(x=>!done[x.symbol]);return i<0?(stocks.length?0:-1):i}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast(`コピーしました：${t}`);return true}catch{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(`コピーしました：${t}`);return true}}
function render(){const n=stocks.length,dc=stocks.filter(x=>done[x.symbol]).length,p=n?Math.round(dc/n*100):0,totalShares=stocks.reduce((s,x)=>s+(Number.isFinite(x.shares)?x.shares:0),0),totalCost=stocks.reduce((s,x)=>s+(Number.isFinite(x.shares)&&Number.isFinite(x.cost)?x.shares*x.cost:0),0);$('#count').textContent=`${dc} / ${n}`;$('#pct').textContent=`${p}% 完了`;$('#totals').textContent=`${n}銘柄 · ${nf(totalShares,3)}株 · 取得総額 ${yen(totalCost)}`;$('#bar').style.width=`${p}%`;const ni=nextIndex(),cur=ni>=0?stocks[ni]:null;$('#cname').textContent=cur?cur.name:'すべて完了';$('#csymbol').textContent=cur?cur.symbol:'—';$('#cshares').textContent=cur?`${nf(cur.shares,3)}株`:'—';$('#ccost').textContent=cur?yen(cur.cost,2):'—';$('#camount').textContent=cur?yen(cur.shares*cur.cost):'—';$('#copytext').textContent=cur?searchText(cur):'—';$('#current').style.opacity=cur?1:.65;$('#list').innerHTML=stocks.map(x=>`<div class="item ${done[x.symbol]?'done':''}" data-symbol="${x.symbol}"><button class="check" data-check="${x.symbol}">${done[x.symbol]?'✓':''}</button><div><div class="nm">${escapeHtml(x.name)}</div><div class="holdline">${nf(x.shares,3)}株 · 取得 ${yen(x.cost,2)} · 取得額 ${yen(x.shares*x.cost)}</div><div class="sm">${escapeHtml(x.symbol)} · 検索: ${escapeHtml(searchText(x))}</div></div><button class="copymini" data-copy="${x.symbol}">コピー</button></div>`).join('')}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function currentStock(){const i=nextIndex();return i>=0?stocks[i]:null}
function markCurrent(){const x=currentStock();if(!x)return;done[x.symbol]=true;saveProgress();render();toast(`${x.name} を追加済みにしました`)}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('on'),1800)}
$('#copyOne').onclick=()=>{const x=currentStock();if(x)copyText(searchText(x))};
$('#mark').onclick=markCurrent;
$('#next').onclick=async()=>{const x=currentStock();if(!x){toast('すべて完了しています');return}await copyText(searchText(x));done[x.symbol]=true;saveProgress();render()};
$('#reset').onclick=()=>{if(confirm('追加済みの進捗をすべてリセットしますか？')){done={};saveProgress();render()}};
$('#allDone').onclick=()=>{stocks.forEach(x=>done[x.symbol]=true);saveProgress();render();toast('すべて追加済みにしました')};
$('#reload').onclick=()=>{loadStocks();toast('現在の持ち株を読み込みました')};
$('#list').onclick=e=>{const c=e.target.closest('[data-copy]');if(c){const x=stocks.find(v=>v.symbol===c.dataset.copy);if(x)copyText(searchText(x));return}const k=e.target.closest('[data-check]');if(k){const s=k.dataset.check;done[s]=!done[s];saveProgress();render()}};
loadProgress();loadStocks();
</script>
</body></html>
