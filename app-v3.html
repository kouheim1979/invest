<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b57d0"><title>Portfolio</title><style>:root{--bg:#f3f5f8;--card:#fff;--ink:#202124;--muted:#626a77;--line:#dfe5ee;--up:#1565c0;--down:#d93025;--accent:#0b57d0}.apple-look{--bg:#000;--card:#111113;--ink:#f5f5f7;--muted:#aaaab3;--line:#303036;--up:#70adff;--down:#ff7972;--accent:#5e9eff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif}.top{position:sticky;top:0;z-index:9;background:var(--card);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 14px 0}.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:10px;padding:12px 0}.brand{font-size:18px;font-weight:800;white-space:nowrap}.search{flex:1;min-width:100px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);padding:9px 11px;font-size:16px}.btn{border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);padding:9px 11px;font-weight:700;cursor:pointer}.tabs{max-width:1100px;margin:auto;display:flex;gap:24px;align-items:center}.tab{border:0;background:transparent;color:var(--muted);padding:10px 2px;border-bottom:3px solid transparent;font-weight:700;cursor:pointer}.tab.on{color:var(--accent);border-color:var(--accent)}main{max-width:1100px;margin:auto;padding:14px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:13px}.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px}.sum span{display:block;color:var(--muted);font-size:11px}.sum b{display:block;font-size:20px;margin-top:3px;font-variant-numeric:tabular-nums}.up{color:var(--up)}.down{color:var(--down)}.tools{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:8px 0 12px}.tools select{border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:8px}.actions{display:flex;gap:7px;flex-wrap:wrap}.desk{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}.desk th,.desk td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:right;font-size:13px;font-variant-numeric:tabular-nums}.desk th:first-child,.desk td:first-child{text-align:left}.desk th{color:var(--muted);font-size:11px}.name{font-weight:800;color:var(--ink);text-decoration:none}.ticker{color:var(--muted);font-size:11px}.edit{font-size:11px;color:var(--accent);border:0;background:transparent;cursor:pointer}.mobile{display:none}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;margin:9px 0}.card-head{display:flex;justify-content:space-between;gap:8px}.card .name{font-size:16px}.quote{text-align:right}.quote b{font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.grid div{background:var(--bg);border-radius:8px;padding:8px}.grid span{display:block;color:var(--muted);font-size:10px}.grid b{font-size:13px}.view-toggle{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.view-toggle button{border:0;border-right:1px solid var(--line);background:var(--card);color:var(--muted);padding:8px;font-size:11px}.view-toggle button:last-child{border-right:0}.view-toggle button.on{background:var(--accent);color:white}.apple-look .card,.apple-look .sum{border-color:#242429}.apple-look .grid{background:#1c1c1e}.apple-look .desk{border-color:#2b2b2e}.apple-look .desk th,.apple-look .desk td{border-color:#28282e}.apple-look .ticker{color:#8e8e93}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:20}.modal[hidden]{display:none}.sheet{width:min(100%,560px);max-height:90vh;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;padding:18px 16px max(18px,env(safe-area-inset-bottom))}.sheet h2{margin:0 0 12px}.sheet label{display:block;color:var(--muted);font-size:12px;margin:10px 0}.sheet input,.sheet textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:9px;font-size:16px}.sheet textarea{min-height:145px;font-family:ui-monospace,monospace}.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sheet .bottom{display:flex;gap:7px;justify-content:flex-end;margin-top:13px}.danger{color:#fff;background:#b3261e;border-color:#b3261e}.primary{color:#fff;background:var(--accent);border-color:var(--accent)}#toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;background:#202124;color:white;border-radius:20px;padding:8px 14px;font-size:12px;transition:.2s;pointer-events:none;z-index:30}#toast.on{opacity:1;transform:translate(-50%,0)}@media(max-width:680px){.brand{font-size:15px}.bar{padding:9px 0;gap:7px}.summary{grid-template-columns:1fr 1fr}.sum b{font-size:18px}.desk{display:none}.mobile{display:block}.tools{align-items:flex-start}.actions{justify-content:flex-end}.actions .btn{font-size:11px;padding:8px}.view-toggle{width:100%}.view-toggle button{flex:1}.search{font-size:16px}.tabs{gap:18px}.tab{font-size:13px}.top{padding-left:10px;padding-right:10px}}</style></head><body><header class="top"><div class="bar"><div class="brand">Portfolio</div><input id="search" class="search" placeholder="銘柄名・コードで検索"><button id="refresh" class="btn">↻ 株価</button></div><div class="tabs"><button class="tab on" data-mode="all">保有銘柄</button><button class="tab" data-mode="up">値上がり</button><button class="tab" data-mode="down">値下がり</button></div></header><main><section class="summary"><div class="sum"><span>評価額</span><b id="market">—</b></div><div class="sum"><span>取得額</span><b id="cost">—</b></div><div class="sum"><span>評価損益</span><b id="gain">—</b></div><div class="sum"><span>前日比</span><b id="day">—</b></div></section><div class="tools"><select id="sort"><option value="value">評価額順</option><option value="gain">評価損益順</option><option value="day">前日比順</option><option value="name">銘柄コード順</option></select><div class="actions"><div class="view-toggle"><button id="viewStandard">標準</button><button id="viewApple">Apple株価風</button></div><button id="import" class="btn">読込</button><button id="add" class="btn">＋銘柄</button></div></div><table class="desk"><thead><tr><th>銘柄</th><th>株価</th><th>前日比</th><th>株数</th><th>取得単価</th><th>取得額</th><th>評価額</th><th>評価損益</th><th></th></tr></thead><tbody id="body"></tbody></table><div id="mobile" class="mobile"></div></main><div id="editBack" class="modal" hidden><div class="sheet"><h2 id="editTitle">銘柄</h2><label>銘柄コード<input id="symbol" placeholder="8306.T"></label><label>銘柄名<input id="name"></label><div class="row"><label>株数<input id="shares" type="number" inputmode="decimal"></label><label>取得単価<input id="unit" type="number" inputmode="decimal"></label></div><div class="bottom"><button id="del" class="btn danger">削除</button><button id="cancel" class="btn">キャンセル</button><button id="save" class="btn primary">保存</button></div></div></div><div id="importBack" class="modal" hidden><div class="sheet"><h2>読込</h2><p style="font-size:12px;color:var(--muted)">保有株JSONを貼り付けるか選択してください。既存データは読込内容で置き換わります。</p><input id="importFile" type="file" accept=".json,application/json"><label>JSON<textarea id="importJson"></textarea></label><div class="bottom"><button id="importCancel" class="btn">キャンセル</button><button id="importDo" class="btn primary">読み込む</button></div></div></div><div id="toast"></div><script src="./quotes-client.js?v=20260909-1"></script><script>
const KEY='kouheim_portfolio_v2',OLD='kouheim_portfolio_v1',VIEW_KEY='kouheim_portfolio_view_v1';let holdings=[],quotes={},mode='all',editIndex=-1;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],yen=n=>Number.isFinite(n)?Math.round(n).toLocaleString():'—',num=n=>Number.isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:2}):'—',cls=n=>n>0?'up':n<0?'down':'',signed=n=>Number.isFinite(n)?(n>0?'+':'')+yen(n):'—',pct=n=>Number.isFinite(n)?(n>0?'+':'')+n.toFixed(2)+'%':'—';
function valid(x){let symbol=String(x.symbol||'').trim().toUpperCase(),name=String(x.name||'').trim(),shares=+x.shares,cost=+x.cost;if(!symbol||!name||!Number.isFinite(shares)||!Number.isFinite(cost)||shares<0||cost<0)return null;return{symbol,name,shares,cost}}
function load(){let d;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!Array.isArray(d)){try{let o=JSON.parse(localStorage.getItem(OLD)||'null');if(Array.isArray(o)){d=o;localStorage.setItem(KEY,JSON.stringify(o))}}catch{}}holdings=Array.isArray(d)?d.map(valid).filter(Boolean):[];render()}
function save(){localStorage.setItem(KEY,JSON.stringify(holdings));render()}
function rowData(h){let q=quotes[h.symbol]||{},p=Number(q.price),prev=Number(q.prevClose),value=Number.isFinite(p)?p*h.shares:NaN,cost=h.cost*h.shares,gain=Number.isFinite(value)?value-cost:NaN,day=Number.isFinite(p)&&Number.isFinite(prev)?(p-prev)*h.shares:NaN,dayPct=Number.isFinite(p)&&Number.isFinite(prev)&&prev?((p/prev)-1)*100:NaN;return{h,q,p,prev,value,cost,gain,day,dayPct}}
function filtered(){let a=holdings.map(rowData);if(mode==='up')a=a.filter(x=>x.day>0);if(mode==='down')a=a.filter(x=>x.day<0);let q=$('#search').value.trim().toLowerCase();if(q)a=a.filter(x=>(x.h.symbol+' '+x.h.name).toLowerCase().includes(q));let s=$('#sort').value;a.sort((a,b)=>s==='gain'?(b.gain||-Infinity)-(a.gain||-Infinity):s==='day'?(b.day||-Infinity)-(a.day||-Infinity):s==='name'?a.h.symbol.localeCompare(b.h.symbol):(b.value||-Infinity)-(a.value||-Infinity));return a}
function render(){let all=holdings.map(rowData),market=all.reduce((s,x)=>s+(Number.isFinite(x.value)?x.value:0),0),cost=all.reduce((s,x)=>s+x.cost,0),gain=market-cost,day=all.reduce((s,x)=>s+(Number.isFinite(x.day)?x.day:0),0);$('#market').textContent='¥'+yen(market);$('#cost').textContent='¥'+yen(cost);$('#gain').textContent=signed(gain);$('#gain').className=cls(gain);$('#day').textContent=signed(day);$('#day').className=cls(day);let a=filtered();$('#body').innerHTML=a.map(x=>{let i=holdings.indexOf(x.h);return`<tr><td><a class="name" href="https://finance.yahoo.co.jp/quote/${encodeURIComponent(x.h.symbol)}" target="_blank" rel="noopener">${x.h.name}</a><div class="ticker">${x.h.symbol}</div></td><td>${Number.isFinite(x.p)?yen(x.p):'—'}</td><td class="${cls(x.day)}">${signed(x.day)}<div class="ticker">${pct(x.dayPct)}</div></td><td>${num(x.h.shares)}</td><td>¥${yen(x.h.cost)}</td><td>¥${yen(x.cost)}</td><td>${Number.isFinite(x.value)?'¥'+yen(x.value):'—'}</td><td class="${cls(x.gain)}">${signed(x.gain)}</td><td><button class="edit chart-btn" onclick="openChart('${x.h.symbol}')">チャート</button><button class="edit" onclick="openEdit(${i})">編集</button></td></tr>`}).join('');$('#mobile').innerHTML=a.map(x=>{let i=holdings.indexOf(x.h);return`<article class="card"><div class="card-head"><div><a class="name" href="https://finance.yahoo.co.jp/quote/${encodeURIComponent(x.h.symbol)}" target="_blank" rel="noopener">${x.h.name}</a><div class="ticker">${x.h.symbol}</div></div><div class="quote"><b>${Number.isFinite(x.p)?yen(x.p):'—'}</b><div class="${cls(x.day)}">${signed(x.day)} ${pct(x.dayPct)}</div></div></div><div class="grid"><div><span>株数</span><b>${num(x.h.shares)}</b></div><div><span>取得単価</span><b>¥${yen(x.h.cost)}</b></div><div><span>取得額</span><b>¥${yen(x.cost)}</b></div><div><span>評価損益</span><b class="${cls(x.gain)}">${signed(x.gain)}</b></div></div><div style="margin-top:8px;text-align:right"><button class="edit chart-btn" onclick="openChart('${x.h.symbol}')">チャート</button><button class="edit" onclick="openEdit(${i})">編集</button></div></article>`}).join('')}
async function refresh(){try{if(!window.PortfolioQuotes)throw Error('quotes-client unavailable');const data=await PortfolioQuotes.refresh(holdings.map(h=>h.symbol));quotes=data.quotes||{};render();toast(PortfolioQuotes.statusText(data));}catch(e){console.error(e);toast('株価更新失敗') }}
function openEdit(i=-1){editIndex=i;let h=i>=0?holdings[i]:{symbol:'',name:'',shares:'',cost:''};$('#editTitle').textContent=i>=0?'銘柄を編集':'銘柄を追加';$('#symbol').value=h.symbol;$('#name').value=h.name;$('#shares').value=h.shares;$('#unit').value=h.cost;$('#del').hidden=i<0;$('#editBack').hidden=false}
function closeEdit(){$('#editBack').hidden=true}
function doSave(){let h=valid({symbol:$('#symbol').value,name:$('#name').value,shares:$('#shares').value,cost:$('#unit').value});if(!h)return toast('入力を確認してください');if(editIndex>=0)holdings[editIndex]=h;else holdings.push(h);save();closeEdit();toast('保存しました')}
function doDel(){if(editIndex<0)return;if(!confirm('この銘柄を削除しますか？'))return;holdings.splice(editIndex,1);save();closeEdit();toast('削除しました')}
function openImport(){$('#importBack').hidden=false}
function closeImport(){$('#importBack').hidden=true}
function doImport(){let d;try{d=JSON.parse($('#importJson').value)}catch{return toast('JSONを確認してください')}if(!Array.isArray(d))return toast('配列形式が必要です');let a=d.map(valid);if(a.some(x=>!x))return toast('データ形式を確認してください');if(!confirm(`現在の${holdings.length}銘柄を、${a.length}銘柄で置き換えますか？`))return;holdings=a;save();closeImport();toast('読み込みました')}
function applyView(){let v=localStorage.getItem(VIEW_KEY)||'standard',apple=v==='apple';document.body.classList.toggle('apple-look',apple);$('#viewStandard').classList.toggle('on',!apple);$('#viewApple').classList.toggle('on',apple)}
function setView(v){localStorage.setItem(VIEW_KEY,v);applyView()}
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>x.classList.remove('on'),2200)}
$('#search').oninput=render;$('#sort').onchange=render;$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');mode=t.dataset.mode;render()});$('#refresh').onclick=$('#reload').onclick=refresh;$('#import').onclick=openImport;$('#add').onclick=()=>openEdit();$('#cancel').onclick=closeEdit;$('#save').onclick=doSave;$('#del').onclick=doDel;$('#editBack').onclick=e=>{if(e.target===$('#editBack'))closeEdit()};$('#importCancel').onclick=closeImport;$('#importDo').onclick=doImport;$('#importBack').onclick=e=>{if(e.target===$('#importBack'))closeImport()};$('#importFile').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(f)$('#importJson').value=await f.text()};$('#viewStandard').onclick=()=>setView('standard');$('#viewApple').onclick=()=>setView('apple');window.openEdit=openEdit;applyView();load();if(location.hash==='#import')openImport();refresh();setInterval(()=>{if(!document.hidden)refresh()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script><script src="./account-filters.js?v=20260909-chart-widget"></script><script src="./charts.js?v=20260909-chart-widget"></script><script src="./dividends-entry.js?v=20260916-dashboard1"></script></body></html>
