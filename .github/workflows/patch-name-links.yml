name: Patch Yahoo Finance name links

on:
  push:
    paths:
      - '.github/workflows/patch-name-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make stock names clickable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app-v3.html')
          s = p.read_text(encoding='utf-8')

          css_old = '.name{font-weight:780}.price,.gain{font-weight:850}'
          css_new = '.name{font-weight:780}.name a,.mn a{color:inherit;text-decoration:none}.name a:active,.mn a:active{opacity:.65}.price,.gain{font-weight:850}'
          if css_old in s:
              s = s.replace(css_old, css_new, 1)

          desktop_old = '<td><div class="name">${esc(h.name||\'—\')}</div><div class="sub">${m.q?esc(m.q.time||\'取得済\'):\'株価未取得\'}</div></td>'
          desktop_new = '<td><div class="name"><a target="_blank" rel="noopener" href="https://finance.yahoo.co.jp/quote/${encodeURIComponent(h.symbol)}">${esc(h.name||\'—\')}</a></div><div class="sub">${m.q?esc(m.q.time||\'取得済\'):\'株価未取得\'}</div></td>'
          if desktop_old not in s:
              raise SystemExit('desktop name pattern not found')
          s = s.replace(desktop_old, desktop_new, 1)

          mobile_old = '<div class="mn">${esc(h.name||h.symbol)}<div class="mcode">${esc(h.symbol)} · ${m.q?esc(m.q.time||\'取得済\'):\'株価未取得\'}</div></div>'
          mobile_new = '<div class="mn"><a target="_blank" rel="noopener" href="https://finance.yahoo.co.jp/quote/${encodeURIComponent(h.symbol)}">${esc(h.name||h.symbol)}</a><div class="mcode">${esc(h.symbol)} · ${m.q?esc(m.q.time||\'取得済\'):\'株価未取得\'}</div></div>'
          if mobile_old not in s:
              raise SystemExit('mobile name pattern not found')
          s = s.replace(mobile_old, mobile_new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-v3.html
          git commit -m 'Make stock names open Yahoo Finance [skip ci]'
          git push origin main
