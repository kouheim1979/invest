name: Dividend history
on:
  push:
    branches: [main, feat/dividend-history-10y]
    paths:
      - 'dividends*'
      - 'scripts/fetch-dividends.py'
      - 'scripts/install-dividends.py'
      - 'tests/dividends*'
      - '.github/workflows/dividends.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 21 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: portfolio-publish
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Validate existing and new features
        run: node --test tests/*.test.cjs
      - name: Refresh public annual dividend data
        run: python3 scripts/fetch-dividends.py
      - name: Install dividend navigation when ready
        run: |
          if [ -f scripts/install-dividends.py ]; then python3 scripts/install-dividends.py; fi
          if [ -f dividends.js ]; then node --check dividends.js; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dividend-validation
          retention-days: 1
          path: |
            *.html
            dividends*
            account-filters.js
            quotes-client.js
            charts.js
            scripts/fetch-dividends.py
            scripts/install-dividends.py
            tests/
            quotes.json
            history.json
      - name: Persist public data only
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dividends-data.json app-v3.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: update dividend history [skip ci]"
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - uses: actions/configure-pages@v5
        if: github.ref_name == 'main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == 'main'
        with:
          path: .
      - uses: actions/deploy-pages@v4
        if: github.ref_name == 'main'
