name: Patch portfolio view toggle

on:
  push:
    paths:
      - '.github/workflows/patch-view-toggle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add standard / Apple Stocks style switch
        shell: bash
        run: |
          python -c "import base64;exec(base64.b64decode('  '))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v3.html index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add standard and Apple Stocks style view toggle"
            git push origin HEAD:main
          fi
