name: Patch portfolio view toggle

on:
  push:
    paths:
      - '.github/workflows/patch-view-toggle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add standard / Apple Stocks style switch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app-v3.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
.view-switch{display:flex;gap:3px;width:max-content;max-width:100%;margin:0 0 10px auto;background:#e8eaed;border-radius:11px;padding:3px}.view-switch button{border:0;background:transparent;color:#555;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:850}.view-switch button.on{background:#fff;color:#111;box-shadow:0 1px 4px #0002}.apple-look{--bg:#000;--line:#29292d;--muted:#98989f;color:#f5f5f7;background:#000}.apple-look .top{background:#000;box-shadow:none;border-bottom:1px solid #242428}.apple-look .search input{background:#1c1c1e;color:#fff}.apple-look .search input::placeholder{color:#8e8e93}.apple-look .notice{background:#111113;color:#a9b5c7;border-color:#2b2b31}.apple-look .box{background:#111113;border-color:#29292d}.apple-look .panel{background:#000;border-color:#29292d}.apple-look .head{background:#111113!important;border-color:#29292d!important}.apple-look select,.apple-look .pill{background:#1c1c1e;border-color:#34343a;color:#f5f5f7}.apple-look .pill.primary{background:#0a84ff;border-color:#0a84ff}.apple-look .view-switch{background:#1c1c1e}.apple-look .view-switch button{color:#aaa}.apple-look .view-switch button.on{background:#3a3a3c;color:#fff;box-shadow:none}.apple-look .mc{background:#000;border:0;border-radius:0;border-bottom:1px solid #29292d;margin:0;padding:13px 4px}.apple-look .mobile{background:#000;padding-top:0}.apple-look .grid{grid-template-columns:repeat(3,1fr);border-top-color:#29292d;margin-top:9px}.apple-look .k,.apple-look .mcode,.apple-look .sub{color:#8e8e93}.apple-look .edit{background:#1c1c1e;color:#64a8ff}.apple-look .name a,.apple-look .mn a{color:#f5f5f7}.apple-look table th{background:#111113;color:#aaa}.apple-look th,.apple-look td{border-bottom-color:#29292d}.apple-look td{color:#f5f5f7}.apple-look .code{color:#64a8ff}.apple-look .empty{color:#98989f}.apple-look .empty strong{color:#f5f5f7}
@media(max-width:800px){.view-switch{margin:0 0 8px auto}.view-switch button{font-size:12px;padding:7px 10px}.apple-look .summary{gap:6px;margin-bottom:7px}.apple-look .box{padding:10px}.apple-look .big{font-size:21px}.apple-look .mc .mtop{align-items:center}.apple-look .mn{font-size:17px}.apple-look .mp{font-size:23px}.apple-look .mchg{font-size:13px}}
'''
          if '.view-switch{' not in s:
              s = s.replace('</style>', css + '</style>', 1)

          switch = '''<div class="view-switch" aria-label="表示切替"><button id="viewStandard" type="button">標準</button><button id="viewApple" type="button">Apple株価風</button></div>\n'''
          if 'id="viewStandard"' not in s:
              s = s.replace('<section class="summary">', switch + '<section class="summary">', 1)

          if "VIEW_KEY='kouheim_portfolio_view_v1'" not in s:
              s = s.replace("const KEY='kouheim_portfolio_v2',OLD='kouheim_portfolio_v1';", "const KEY='kouheim_portfolio_v2',OLD='kouheim_portfolio_v1',VIEW_KEY='kouheim_portfolio_view_v1';", 1)

          js = r'''
function applyView(){let v=localStorage.getItem(VIEW_KEY)||'standard',apple=v==='apple';document.body.classList.toggle('apple-look',apple);const a=$('#viewApple'),n=$('#viewStandard');if(a)a.classList.toggle('on',apple);if(n)n.classList.toggle('on',!apple)}
function setView(v){localStorage.setItem(VIEW_KEY,v);applyView()}
'''
          if 'function applyView()' not in s:
              marker = "function toast(t){"
              s = s.replace(marker, js + marker, 1)

          if "$('#viewStandard').onclick" not in s:
              marker = "window.openEdit=openEdit;load();refresh();"
              repl = "$('#viewStandard').onclick=()=>setView('standard');$('#viewApple').onclick=()=>setView('apple');window.openEdit=openEdit;applyView();load();refresh();"
              s = s.replace(marker, repl, 1)

          p.write_text(s, encoding='utf-8')

          idx = Path('index.html')
          t = idx.read_text(encoding='utf-8')
          t = re.sub(r'app-v3\.html\?v=[^\"\'<]+', 'app-v3.html?v=20260905-view-toggle', t)
          idx.write_text(t, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v3.html index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add standard and Apple Stocks style view toggle"
            git push origin HEAD:main
          fi
