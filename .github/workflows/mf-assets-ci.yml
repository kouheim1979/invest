name: Asset Compass verification
on:
  push:
    branches: [main, feature/asset-compass-20260916, 'fix/asset-income-*']
    paths: ['mf-assets/**', 'tests/mf-assets*.test.cjs', '.github/workflows/mf-assets-ci.yml']
  pull_request:
    paths: ['mf-assets/**', 'tests/mf-assets*.test.cjs', '.github/workflows/mf-assets-ci.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and financial unit tests
        id: unit
        continue-on-error: true
        run: |
          mkdir -p mf-assets/test-results
          node --check mf-assets/core.js
          node --check mf-assets/app.js
          node --check mf-assets/income-policy.js
          node --check mf-assets/income-diagnostics.js
          set -o pipefail
          node --test tests/mf-assets*.test.cjs 2>&1 | tee mf-assets/test-results/unit-tests.txt
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Browser workflows and responsive checks
        id: browser
        continue-on-error: true
        run: |
          python -m http.server 8080 --bind 127.0.0.1 > /tmp/asset-compass-server.log 2>&1 &
          for n in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/mf-assets/ > /dev/null && break || sleep 1; done
          python mf-assets/tests/browser.py
          python mf-assets/tests/income-browser.py
      - name: Upload source and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-compass-verification
          path: |
            mf-assets/
            tests/mf-assets*.test.cjs
          retention-days: 7
      - name: Require both test suites
        if: always()
        run: |
          test '${{ steps.unit.outcome }}' = 'success'
          test '${{ steps.browser.outcome }}' = 'success'
