name: Bump NISA filter cache

on:
  push:
    paths:
      - '.github/workflows/patch-account-filters.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump app cache keys
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('app-v3.html')
          s = app.read_text(encoding='utf-8')
          s = re.sub(r'account-filters\.js\?v=[^"\']+', 'account-filters.js?v=20260906-tax2', s)
          app.write_text(s, encoding='utf-8')

          idx = Path('index.html')
          t = idx.read_text(encoding='utf-8')
          t = re.sub(r'app-v3\.html\?v=[^"\']+', 'app-v3.html?v=20260906-tax2', t)
          idx.write_text(t, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v3.html index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh NISA filter assets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
