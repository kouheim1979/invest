name: Patch account ownership filters

on:
  push:
    paths:
      - '.github/workflows/patch-account-filters.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add owner and brokerage filters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('app-v3.html')
          s=p.read_text(encoding='utf-8')

          css=r'''
/* account-filter-v1 */
.account-filters{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:9px}.filter-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.filter-row+.filter-row{margin-top:8px}.filter-label{font-size:12px;font-weight:850;color:var(--muted);min-width:44px}.fchip{border:1px solid #d4d9df;background:#f8f9fa;color:#42464b;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:800}.fchip.on{background:#202124;color:#fff;border-color:#202124}.lot-status{margin-left:auto;font-size:11px;color:var(--muted)}.ownerline{font-size:11px;color:var(--muted);margin-top:3px}.lotbtn{border:0;background:transparent;color:inherit;font:inherit;font-weight:800;padding:0;text-align:right}.lotbtn small{display:block;font-size:10px;color:#174ea6;margin-top:2px}.lot-table{display:grid;gap:8px;margin-top:12px}.lot-row{display:grid;grid-template-columns:1.1fr 1.25fr .75fr .9fr .95fr;gap:7px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:10px}.lot-row.head{border:0;padding:0 10px;color:var(--muted);font-size:10px}.lot-cell{font-size:12px;font-weight:750}.lot-cell.num{text-align:right;font-variant-numeric:tabular-nums}.lot-owner{font-weight:900}.lot-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:10px}.apple-look .account-filters{background:#111113;border-color:#29292d}.apple-look .fchip{background:#1c1c1e;border-color:#34343a;color:#ddd}.apple-look .fchip.on{background:#f5f5f7;color:#111;border-color:#f5f5f7}.apple-look .lotbtn small{color:#64a8ff}.apple-look .lot-row{border-color:#34343a}.apple-look .modal{background:#1c1c1e;color:#f5f5f7}.apple-look .lot-note{color:#98989f}
@media(max-width:800px){.account-filters{padding:9px}.filter-label{width:100%;min-width:0}.lot-status{width:100%;margin-left:0}.fchip{font-size:12px;padding:7px 10px}.ownerline{font-size:11px}.lot-row{grid-template-columns:1fr 1fr;gap:5px 9px}.lot-row.head{display:none}.lot-cell.num{text-align:left}.lot-cell:before{display:block;font-size:9px;color:var(--muted);font-weight:600}.lot-row .lot-cell:nth-child(1):before{content:'名義'}.lot-row .lot-cell:nth-child(2):before{content:'証券会社'}.lot-row .lot-cell:nth-child(3):before{content:'株数'}.lot-row .lot-cell:nth-child(4):before{content:'取得単価'}.lot-row .lot-cell:nth-child(5):before{content:'取得額'}}
'''
          if '/* account-filter-v1 */' not in s:
              s=s.replace('</style>',css+'\n</style>',1)

          filters='''<section class="account-filters" id="accountFilters"><div class="filter-row"><div class="filter-label">名義</div><button class="fchip" data-owner="all">全員</button><button class="fchip" data-owner="OTS">本人</button><button class="fchip" data-owner="OKS">妻</button><button class="fchip" data-owner="MIK">MIK</button><button class="fchip" data-owner="RIN">RIN</button></div><div class="filter-row"><div class="filter-label">証券</div><button class="fchip" data-broker="all">全口座</button><button class="fchip" data-broker="SBI">SBI</button><button class="fchip" data-broker="eSmart">eスマート</button><div class="lot-status" id="lotStatus">口座内訳を確認中…</div></div></section>\n'''
          if 'id="accountFilters"' not in s:
              s=s.replace('<section class="summary">',filters+'<section class="summary">',1)

          detail='''<div class="back" id="lotBack"><div class="modal"><h2 id="lotTitle">保有内訳</h2><div class="desc" id="lotDesc"></div><div class="lot-table" id="lotTable"></div><div class="lot-note">※ NISA・特定・一般などの課税区分は元データでは未確認です。ここでは名義と証券会社を表示しています。</div><div class="actions"><button class="save" id="lotClose">閉じる</button></div></div></div>'''
          if 'id="lotBack"' not in s:
              s=s.replace('<div class="toast" id="toast"></div>',detail+'<div class="toast" id="toast"></div>',1)

          old="const KEY='kouheim_portfolio_v2',OLD='kouheim_portfolio_v1',VIEW_KEY='kouheim_portfolio_view_v1';let H=[],Q={},editing=-1,mode='all';"
          new="const KEY='kouheim_portfolio_v2',OLD='kouheim_portfolio_v1',VIEW_KEY='kouheim_portfolio_view_v1',LOTS_KEY='kouheim_portfolio_lots_v1';let H=[],LOTS=[],Q={},editing=-1,mode='all',ownerFilter='all',brokerFilter='all';"
          if old in s:
              s=s.replace(old,new,1)

          js=r'''
/* account-filter-js-v1 */
const OWNER_LABEL={OTS:'本人',OKS:'妻',MIK:'MIK',RIN:'RIN'};
function ownerLabel(x){return OWNER_LABEL[x]||x||'—'}
function brokerLabel(x){return x==='eSmart'?'eスマート':x==='SBI'?'SBI':x||'—'}
function normLot(x){let shares=Number(x.shares??0),cost=Number(x.cost??0),amount=Number(x.amount);return{symbol:String(x.symbol||x.code||'').trim().toUpperCase(),name:String(x.name||'').trim(),owner:String(x.owner||'').trim().toUpperCase(),broker:String(x.broker||x.account||'').trim(),shares,cost,amount:Number.isFinite(amount)?amount:shares*cost}}
function validLot(x){return x.symbol&&x.owner&&x.broker&&Number.isFinite(x.shares)&&x.shares>=0&&Number.isFinite(x.cost)&&x.cost>=0&&Number.isFinite(x.amount)}
function loadLots(){try{LOTS=(JSON.parse(localStorage.getItem(LOTS_KEY)||'[]')).map(normLot).filter(validLot)}catch{LOTS=[]}}
function lotMatches(x){return(ownerFilter==='all'||x.owner===ownerFilter)&&(brokerFilter==='all'||x.broker===brokerFilter)}
function filteredLots(){return LOTS.filter(lotMatches)}
function aggregateLots(ls){let z={};for(const l of ls){if(!z[l.symbol])z[l.symbol]={symbol:l.symbol,name:l.name||H.find(x=>x.symbol===l.symbol)?.name||'',shares:0,amount:0};z[l.symbol].shares+=l.shares;z[l.symbol].amount+=l.amount}return Object.values(z).filter(x=>x.shares>0).map(x=>({symbol:x.symbol,name:x.name,shares:x.shares,cost:x.amount/x.shares,_amount:x.amount,_i:H.findIndex(h=>h.symbol===x.symbol)}))}
function activeHoldings(){if(ownerFilter==='all'&&brokerFilter==='all')return H.map((h,i)=>({...h,_i:i}));if(!LOTS.length)return[];return aggregateLots(filteredLots())}
function ownerSummary(symbol){if(!LOTS.length)return'';let a={};for(const l of LOTS.filter(x=>x.symbol===symbol))a[l.owner]=(a[l.owner]||0)+l.shares;return Object.entries(a).map(([o,n])=>`${ownerLabel(o)} ${nf(n,3)}株`).join(' · ')}
function renderFilters(){document.querySelectorAll('[data-owner]').forEach(b=>b.classList.toggle('on',b.dataset.owner===ownerFilter));document.querySelectorAll('[data-broker]').forEach(b=>b.classList.toggle('on',b.dataset.broker===brokerFilter));const st=$('#lotStatus');if(st)st.textContent=LOTS.length?`口座内訳 ${LOTS.length}明細 · ${nf(LOTS.reduce((s,x)=>s+x.shares,0),3)}株`:'口座内訳データなし（「読込」で追加）'}
function setOwner(v){if(!LOTS.length&&v!=='all'){toast('先に口座内訳データを読み込んでください');return}ownerFilter=v;renderFilters();render()}
function setBroker(v){if(!LOTS.length&&v!=='all'){toast('先に口座内訳データを読み込んでください');return}brokerFilter=v;renderFilters();render()}
function openLots(symbol){let ls=LOTS.filter(x=>x.symbol===symbol);if(!ls.length){toast('この銘柄の口座内訳データがありません');return}let h=H.find(x=>x.symbol===symbol)||ls[0],shares=ls.reduce((s,x)=>s+x.shares,0),amount=ls.reduce((s,x)=>s+x.amount,0);$('#lotTitle').textContent=`${h.name||symbol} の保有内訳`;$('#lotDesc').textContent=`${symbol} · 合計 ${nf(shares,3)}株 · 取得額 ${yen(amount)}`;$('#lotTable').innerHTML=`<div class="lot-row head"><div>名義</div><div>証券会社</div><div style="text-align:right">株数</div><div style="text-align:right">取得単価</div><div style="text-align:right">取得額</div></div>`+ls.map(l=>`<div class="lot-row"><div class="lot-cell lot-owner">${esc(ownerLabel(l.owner))}</div><div class="lot-cell">${esc(brokerLabel(l.broker))}</div><div class="lot-cell num">${nf(l.shares,3)}株</div><div class="lot-cell num">${yen(l.cost,2)}</div><div class="lot-cell num">${yen(l.amount)}</div></div>`).join('');$('#lotBack').classList.add('on')}
function closeLots(){$('#lotBack').classList.remove('on')}
function load(){try{let r=localStorage.getItem(KEY);if(!r){r=localStorage.getItem(OLD);if(r){localStorage.setItem(KEY,r);localStorage.removeItem(OLD)}}H=(JSON.parse(r||'[]')).map(norm).filter(valid);const f=H.find(x=>x.symbol==='8267.T');if(f&&f.shares===1680&&Math.abs(f.cost-771.8214285714286)<0.02){f.cost=1296657/1680;localStorage.setItem(KEY,JSON.stringify(H))}}catch{H=[]}loadLots();renderFilters();render()}
function getRows(){let V=activeHoldings(),r=V.map(h=>({h,i:Number.isInteger(h._i)?h._i:H.findIndex(x=>x.symbol===h.symbol),m:m(h)})),q=$('#search').value.trim().toLowerCase();if(q)r=r.filter(x=>x.h.symbol.toLowerCase().includes(q)||x.h.name.toLowerCase().includes(q));if(mode==='up')r=r.filter(x=>(x.m.d??0)>0);if(mode==='down')r=r.filter(x=>(x.m.d??0)<0);let so=$('#sort').value;r.sort((a,b)=>so==='code'?a.h.symbol.localeCompare(b.h.symbol,'ja',{numeric:true}):so==='name'?a.h.name.localeCompare(b.h.name,'ja'):so==='gain'?(b.m.g??-Infinity)-(a.m.g??-Infinity):so==='day'?(b.m.dp??-Infinity)-(a.m.dp??-Infinity):(b.m.val??-Infinity)-(a.m.val??-Infinity));return r}
function render(){renderFilters();let r=getRows(),V=activeHoldings();$('#empty').hidden=V.length>0;$('#body').innerHTML=r.map(({h,i,m})=>{let os=ownerSummary(h.symbol);return`<tr><td><a class="code" target="_blank" rel="noopener" href="https://finance.yahoo.co.jp/quote/${encodeURIComponent(h.symbol)}">${esc(h.symbol)}</a></td><td><div class="name"><a target="_blank" rel="noopener" href="https://finance.yahoo.co.jp/quote/${encodeURIComponent(h.symbol)}">${esc(h.name||'—')}</a></div><div class="sub">${m.q?esc(m.q.time||'取得済'):'株価未取得'}</div>${os?`<div class="ownerline">${esc(os)}</div>`:''}</td><td class="price">${m.q?yen(m.q.price,m.q.price<100?2:0):'取得不可'}</td><td class="${cl(m.d)}">${sg(m.d,m.q?.price<100?2:0)}<div class="sub ${cl(m.dp)}">${sg(m.dp,2,'%')}</div></td><td><button class="lotbtn" onclick="openLots('${esc(h.symbol)}')">${nf(h.shares,3)}株<small>内訳 ›</small></button></td><td>${yen(h.cost,2)}</td><td>${yen(m.val)}</td><td class="gain ${cl(m.g)}">${ys(m.g)}<div class="sub ${cl(m.gp)}">${sg(m.gp,2,'%')}</div></td><td>${i>=0?`<button class="edit" onclick="openEdit(${i})">編集</button>`:''}</td></tr>`}).join('');$('#mobile').innerHTML=r.map(({h,i,m})=>{let os=ownerSummary(h.symbol);return`<div class="mc"><div class="mtop"><div class="mn"><a target="_blank" rel="noopener" href="https://finance.yahoo.co.jp/quote/${encodeURIComponent(h.symbol)}">${esc(h.name||h.symbol)}</a><div class="mcode">${esc(h.symbol)} · ${m.q?esc(m.q.time||'取得済'):'株価未取得'}</div>${os?`<div class="ownerline">${esc(os)}</div>`:''}</div><div><div class="mp">${m.q?yen(m.q.price,m.q.price<100?2:0):'—'}</div><div class="mchg ${cl(m.d)}">${sg(m.d,m.q?.price<100?2:0)} (${sg(m.dp,2,'%')})</div></div></div><div class="grid"><div><div class="k">保有数</div><button class="lotbtn v" onclick="openLots('${esc(h.symbol)}')">${nf(h.shares,3)}株<small>内訳 ›</small></button></div><div><div class="k">取得単価</div><div class="v">${yen(h.cost,2)}</div></div><div><div class="k">評価額</div><div class="v">${yen(m.val)}</div></div><div><div class="k">取得額</div><div class="v">${yen(m.acq)}</div></div><div><div class="k">評価損益</div><div class="v ${cl(m.g)}">${ys(m.g)}</div></div><div><div class="k">損益率</div><div class="v ${cl(m.gp)}">${sg(m.gp,2,'%')}</div></div></div><div style="text-align:right;margin-top:8px">${i>=0?`<button class="edit" onclick="openEdit(${i})">編集</button>`:''}</div></div>`}).join('');summary()}
function summary(){let V=activeHoldings(),a=V.map(m),cost=a.reduce((s,x)=>s+x.acq,0),k=a.filter(x=>Number.isFinite(x.val)),val=k.reduce((s,x)=>s+x.val,0),g=k.reduce((s,x)=>s+x.g,0),kc=k.reduce((s,x)=>s+x.acq,0),dk=k.filter(x=>Number.isFinite(x.dv)),day=dk.reduce((s,x)=>s+x.dv,0),prev=dk.reduce((s,x)=>s+x.val-x.dv,0),filtered=ownerFilter!=='all'||brokerFilter!=='all';$('#sCost').textContent=yen(cost);$('#sCount').textContent=`${V.length}銘柄 · ${nf(V.reduce((s,h)=>s+h.shares,0),3)}株${filtered?' · 絞込中':''}`;$('#sValue').textContent=k.length?yen(val):'—';$('#sValueSub').textContent=`${k.length}/${V.length}銘柄の株価取得済`;$('#sGain').textContent=k.length?ys(g):'—';$('#sGain').className='big '+cl(g);$('#sGainPct').textContent=k.length&&kc?sg(g/kc*100,2,'%'):'—';$('#sGainPct').className='sub '+cl(g);$('#sDay').textContent=dk.length?ys(day):'—';$('#sDay').className='big '+cl(day);$('#sDayPct').textContent=dk.length&&prev?sg(day/prev*100,2,'%'):'—';$('#sDayPct').className='sub '+cl(day)}
function doImport(){try{let raw=$('#importJson').value.trim();if(!raw){toast('JSONファイルを選ぶかJSONを貼り付けてください');return}let p=JSON.parse(raw),arr=Array.isArray(p)?p:p.holdings;if(!Array.isArray(arr))throw Error('holdings配列がありません');let x=arr.map(norm).filter(valid);if(!x.length)throw Error('有効な銘柄がありません');if(H.length&&!confirm(`現在の${H.length}銘柄を、読み込んだ${x.length}銘柄で置き換えますか？`))return;H=x;const f=H.find(v=>v.symbol==='8267.T');if(f&&f.shares===1680&&Math.abs(f.cost-771.8214285714286)<0.02)f.cost=1296657/1680;localStorage.setItem(KEY,JSON.stringify(H));if(!Array.isArray(p)&&Array.isArray(p.lots)){LOTS=p.lots.map(normLot).filter(validLot);localStorage.setItem(LOTS_KEY,JSON.stringify(LOTS))}else{LOTS=[];localStorage.removeItem(LOTS_KEY)}ownerFilter='all';brokerFilter='all';saveLocal();closeImport();renderFilters();toast(`${H.length}銘柄を読み込みました${LOTS.length?`・口座内訳${LOTS.length}明細`:''}`);refresh()}catch(e){toast(`JSONを読み込めません: ${e?.message||'形式を確認してください'}`)}}
'''
          if '/* account-filter-js-v1 */' not in s:
              s=s.replace('function toast(t){',js+'\nfunction toast(t){',1)

          marker="$('#viewStandard').onclick=()=>setView('standard');$('#viewApple').onclick=()=>setView('apple');window.openEdit=openEdit;applyView();load();refresh();"
          repl="document.querySelectorAll('[data-owner]').forEach(b=>b.onclick=()=>setOwner(b.dataset.owner));document.querySelectorAll('[data-broker]').forEach(b=>b.onclick=()=>setBroker(b.dataset.broker));$('#lotClose').onclick=closeLots;$('#lotBack').onclick=e=>{if(e.target===$('#lotBack'))closeLots()};$('#viewStandard').onclick=()=>setView('standard');$('#viewApple').onclick=()=>setView('apple');window.openEdit=openEdit;window.openLots=openLots;applyView();load();refresh();"
          if marker in s and "window.openLots=openLots" not in s:
              s=s.replace(marker,repl,1)

          p.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          t=idx.read_text(encoding='utf-8')
          t=re.sub(r'app-v3\.html\?v=[^\"\'<]+','app-v3.html?v=20260906-account-filters',t)
          idx.write_text(t,encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v3.html index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add owner and brokerage account filters"
            git push origin HEAD:main
          fi
