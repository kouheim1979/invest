name: Unified app verification
on:
  push:
    branches: [main, 'feat/unified-app-*']
    paths: ['suite*', 'unified.html', 'index.html', 'mf-assets/**', 'tests/suite*', 'tests/mf-assets*', '.github/workflows/suite-ci.yml']
  pull_request:
    paths: ['suite*', 'unified.html', 'index.html', 'mf-assets/**', 'tests/suite*', 'tests/mf-assets*', '.github/workflows/suite-ci.yml']
permissions:
  contents: read
concurrency:
  group: suite-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and all financial regressions
        run: |
          node --check suite.js
          node --check suite-core.js
          node --check suite-asset-adapter.js
          node --test tests/*.test.cjs
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Unified navigation, data compatibility, privacy and responsive checks
        run: |
          python tests/suite-browser.py
          python tests/suite-purpose-browser.py
      - name: Existing 10-year dividend views
        run: |
          python tests/dividends-dashboard-browser.py
          python tests/dividends-selection-browser.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-app-verification
          path: |
            suite-test-results/
            test-results/
          retention-days: 7
