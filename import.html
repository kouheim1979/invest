<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b57d0"><title>Portfolio Import</title><style>html,body{margin:0;background:#f3f5f7;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif}.wrap{max-width:620px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 14px 30px}.card{background:#fff;border:1px solid #e3e7eb;border-radius:16px;padding:18px;box-shadow:0 2px 10px #0000000b}h1{font-size:20px;margin:0 0 6px}.desc{font-size:12px;line-height:1.7;color:#6b7280;margin-bottom:16px}label{display:block;font-size:11px;font-weight:800;color:#6b7280;margin:12px 0 5px}input,textarea,button{font:inherit}input[type=file],textarea{width:100%;box-sizing:border-box;border:1px solid #ccd2d8;border-radius:10px;background:#fff;padding:11px}textarea{min-height:190px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1;border:1px solid #d4d9df;border-radius:10px;padding:11px;background:#fff;font-weight:800}.actions .primary{background:#0b57d0;border-color:#0b57d0;color:#fff}.status{font-size:12px;margin-top:12px;min-height:18px}.ok{color:#137333}.err{color:#b3261e}</style></head><body><main class="wrap"><div class="card"><h1>保有データを読み込む</h1><div class="desc">JSONファイルを選択するか、JSONを貼り付けてください。読み込んだ内容はこのiPhone / Safari内だけに保存され、現在の保有データを置き換えます。</div><label>JSONファイル</label><input id="file" type="file" accept="application/json,.json"><label>JSONを貼り付け</label><textarea id="json" placeholder='[{"symbol":"8306.T","name":"三菱UFJ FG","shares":4100,"cost":465.902439}]'></textarea><div class="actions"><button id="back">戻る</button><button class="primary" id="do">読み込む</button></div><div class="status" id="status"></div></div></main><script>const KEY='kouheim_portfolio_v2';const $=s=>document.querySelector(s);function norm(x){return{symbol:String(x.symbol||x.code||'').trim().toUpperCase(),name:String(x.name||x.company||'').trim(),shares:Number(x.shares??x.quantity??0),cost:Number(x.cost??x.purchasePrice??x.purchase_price??0)}}function valid(x){return x.symbol&&Number.isFinite(x.shares)&&x.shares>=0&&Number.isFinite(x.cost)&&x.cost>=0}function msg(t,ok=false){$('#status').textContent=t;$('#status').className='status '+(ok?'ok':'err')}$('#file').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(f){$('#json').value=await f.text();msg(`${f.name} を読み込みました`,true)}};$('#back').onclick=()=>location.href='./app-v3.html?v=20260904-restore-import';$('#do').onclick=()=>{try{const raw=$('#json').value.trim();if(!raw)throw Error('JSONファイルを選ぶか、JSONを貼り付けてください');const p=JSON.parse(raw);const arr=Array.isArray(p)?p:p.holdings;if(!Array.isArray(arr))throw Error('holdings配列がありません');const x=arr.map(norm).filter(valid);if(!x.length)throw Error('有効な銘柄がありません');const cur=JSON.parse(localStorage.getItem(KEY)||'[]');if(cur.length&&!confirm(`現在の${cur.length}銘柄を、読み込んだ${x.length}銘柄で置き換えますか？`))return;const aeon=x.find(v=>v.symbol==='8267.T');if(aeon&&aeon.shares===1680&&Math.abs(aeon.cost-771.8214285714286)<0.02)aeon.cost=1296657/1680;localStorage.setItem(KEY,JSON.stringify(x));msg(`${x.length}銘柄を読み込みました。ポートフォリオへ戻ります。`,true);setTimeout(()=>location.href='./app-v3.html?v=20260904-restore-import',350)}catch(e){msg(`読み込みエラー: ${e.message||e}`)}};</script></body></html>
