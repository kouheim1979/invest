<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b57d0"><title>Portfolio setup</title><style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;background:#f3f5f7;color:#202124}body{min-height:100vh;display:grid;place-items:center}.card{width:min(420px,calc(100% - 28px));background:#fff;border:1px solid #e3e7eb;border-radius:16px;padding:24px;box-shadow:0 6px 24px #00000010;text-align:center}h1{font-size:20px;margin:0 0 8px}p{font-size:13px;line-height:1.7;color:#5f6368;margin:0 0 16px}.spin{width:28px;height:28px;border:3px solid #dce7fb;border-top-color:#0b57d0;border-radius:50%;animation:r .8s linear infinite;margin:18px auto}@keyframes r{to{transform:rotate(360deg)}}button{border:0;border-radius:10px;background:#0b57d0;color:#fff;padding:11px 18px;font-weight:800}</style></head><body><div class="card"><h1 id="title">現在の持ち株を設定中</h1><div class="spin" id="spin"></div><p id="msg">保有データを復号して、このiPhone内だけに保存します。</p><button id="go" hidden>ポートフォリオを開く</button></div><script>
const KEY='kouheim_portfolio_v2',AAD='kouheim-invest-v3';const $=s=>document.querySelector(s);function b64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}async function run(){try{const p=new URLSearchParams(location.hash.slice(1)),k=p.get('k');if(!k)throw Error('key');const r=await fetch(`./portfolio.enc.json?ts=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error('fetch');const enc=await r.json(),key=await crypto.subtle.importKey('raw',b64u(k),{name:'AES-GCM'},false,['decrypt']),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u(enc.nonce),additionalData:new TextEncoder().encode(AAD)},key,b64u(enc.data)),data=JSON.parse(new TextDecoder().decode(plain));if(!Array.isArray(data.holdings)||!data.holdings.length)throw Error('empty');const h=data.holdings.map(x=>({symbol:String(x.symbol||'').trim().toUpperCase(),name:String(x.name||'').trim(),shares:Number(x.shares),cost:Number(x.cost)})).filter(x=>x.symbol&&Number.isFinite(x.shares)&&x.shares>=0&&Number.isFinite(x.cost)&&x.cost>=0);if(!h.length)throw Error('invalid');localStorage.setItem(KEY,JSON.stringify(h));history.replaceState(null,'',location.pathname);$('#spin').hidden=true;$('#title').textContent=`${h.length}銘柄を登録しました`;$('#msg').textContent='保有数・取得単価はこのSafari内に保存しました。株価画面へ移動します。';const b=$('#go');b.hidden=false;b.onclick=()=>location.replace('./app-v3.html');setTimeout(()=>location.replace('./app-v3.html'),900)}catch(e){$('#spin').hidden=true;$('#title').textContent='読み込みに失敗しました';$('#msg').textContent='専用セットアップリンクをSafariで開き直してください。';const b=$('#go');b.hidden=false;b.textContent='ポートフォリオを開く';b.onclick=()=>location.replace('./app-v3.html')}}run();
</script></body></html>
