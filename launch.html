<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio setup</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6f8;color:#202124;margin:0;display:grid;place-items:center;min-height:100vh}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;max-width:420px;margin:20px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.06)}h1{font-size:20px;margin:0 0 8px}p{font-size:13px;line-height:1.7;color:#5f6368}button{border:0;border-radius:10px;background:#0b57d0;color:#fff;padding:11px 18px;font-weight:800}</style></head><body><div class="card"><h1 id="title">ポートフォリオを設定中</h1><p id="msg">このURLの # 以降にあるデータだけを端末内へ保存します。GitHubサーバーには送信しません。</p><button id="go" hidden>ポートフォリオを開く</button></div><script>
const KEY='kouheim_portfolio_v1';
function decodeBase64Url(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function valid(x){return x&&typeof x.symbol==='string'&&x.symbol&&Number.isFinite(Number(x.shares))&&Number(x.shares)>=0&&Number.isFinite(Number(x.cost))&&Number(x.cost)>=0}
try{const hash=location.hash.slice(1);const p=new URLSearchParams(hash);const d=p.get('d');if(!d)throw new Error('no-data');const parsed=JSON.parse(decodeBase64Url(d));const arr=Array.isArray(parsed)?parsed:parsed.holdings;if(!Array.isArray(arr))throw new Error('bad-format');const holdings=arr.map(x=>({symbol:String(x.symbol).trim().toUpperCase(),name:String(x.name||'').trim(),shares:Number(x.shares),cost:Number(x.cost)})).filter(valid);if(!holdings.length)throw new Error('empty');localStorage.setItem(KEY,JSON.stringify(holdings));history.replaceState(null,'',location.pathname);document.getElementById('title').textContent=`${holdings.length}銘柄を登録しました`;document.getElementById('msg').textContent='保有数・取得単価はこの端末のブラウザ内に保存されました。';const b=document.getElementById('go');b.hidden=false;b.onclick=()=>location.replace('./');setTimeout(()=>location.replace('./'),700)}catch(e){document.getElementById('title').textContent='読み込みできませんでした';document.getElementById('msg').textContent='専用リンクから開き直してください。';const b=document.getElementById('go');b.hidden=false;b.textContent='ポートフォリオを開く';b.onclick=()=>location.replace('./')}
</script></body></html>
